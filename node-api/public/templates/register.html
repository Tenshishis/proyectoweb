<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media (max-width: 576px) {
            .auth-card { padding: 1rem !important; }
            .auth-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center py-3" style="min-height: 100svh;">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-5">
                <div class="card shadow p-4 auth-card">
                    <h2 class="mb-4 auth-title">Registro</h2>
                    <form id="register-form" method="POST" action="/register">
                        <input type="text" id="nombre" name="nombre" class="form-control mb-2" placeholder="Nombre" required>
                        <input type="text" id="username" name="username" class="form-control mb-2" placeholder="Usuario" required>
                        <input type="email" id="email" name="email" class="form-control mb-2" placeholder="Email" required>
                        <input type="password" id="password" name="password" class="form-control mb-2" placeholder="Contraseña" required>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control mb-3" placeholder="Confirmar contraseña" required>
                        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                    </form>
                    <a href="/login" class="btn btn-link mt-3">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const registerForm = document.getElementById('register-form');
        const registerInputs = {
            nombre: document.getElementById('nombre'),
            username: document.getElementById('username'),
            email: document.getElementById('email'),
            password: document.getElementById('password'),
            confirmPassword: document.getElementById('confirmPassword')
        };

        function setInvalid(input, isInvalid) {
            input.classList.toggle('is-invalid', isInvalid);
        }

        Object.values(registerInputs).forEach((input) => {
            input.addEventListener('input', () => setInvalid(input, false));
        });

        registerForm.addEventListener('submit', (event) => {
            const missing = [];
            const nombre = registerInputs.nombre.value.trim();
            const username = registerInputs.username.value.trim();
            const email = registerInputs.email.value.trim();
            const password = registerInputs.password.value;
            const confirmPassword = registerInputs.confirmPassword.value;

            setInvalid(registerInputs.nombre, !nombre);
            setInvalid(registerInputs.username, !username);
            setInvalid(registerInputs.email, !email);
            setInvalid(registerInputs.password, !password);
            setInvalid(registerInputs.confirmPassword, !confirmPassword);

            if (!nombre) missing.push('nombre');
            if (!username) missing.push('usuario');
            if (!email) missing.push('email');
            if (!password) missing.push('contrasena');
            if (!confirmPassword) missing.push('confirmacion de contrasena');

            if (missing.length) {
                event.preventDefault();
                alert(`Completa los siguientes campos: ${missing.join(', ')}`);
                return;
            }

            if (password !== confirmPassword) {
                event.preventDefault();
                setInvalid(registerInputs.password, true);
                setInvalid(registerInputs.confirmPassword, true);
                alert('La confirmacion de contrasena no coincide.');
            }
        });
    </script>
</body>
</html>
