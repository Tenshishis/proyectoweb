services:
  - type: web
    name: proyectoweb-backend
    env: node
    rootDir: node-api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_NODE_UI
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
      - key: DEFAULT_ADMIN_NAME
        value: Administrador
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@local
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: proyectoweb-frontend
    env: python
    rootDir: frontend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: API_BASE
        sync: false
      - key: FLASK_SECRET
        sync: false
